# run make test for python

name: Python Tests

on:
  - pull_request

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  python-translations:
    runs-on: ubuntu-latest

    steps:
      # Define which file extensions, when touched, should trigger the
      # Python tests, so we can skip this Action if we've only touched .po files
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            non_pofiles:
              - '**.txt'
              - '**.yml'
              - '**.in'
              - '**.py'

      # Clones the openedx-translations repo
      - name: clone openedx/openedx-translations
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup node for testing
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"

      - name: Install nodejs requirements
        run: |
          npm clean-install

      - name: Install gettext
        if: steps.filter.outputs.non_pofiles == 'true'
        run: |
          sudo apt install -y gettext

      # Sets up Python
      - name: setup python
        if: steps.filter.outputs.non_pofiles == 'true'
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # Run the script
      - name: run python tests
        if: steps.filter.outputs.non_pofiles == 'true'
        run: |
          make test_requirements
          make test
